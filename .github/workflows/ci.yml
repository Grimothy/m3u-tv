name: Flutter Client

on:
  pull_request:
    branches: [main, master, dev, flutter]
  push:
    branches: [main, master, dev, flutter]
  workflow_dispatch: {}

concurrency:
  group: flutter-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect desktop-affecting changes
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.desktop == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            desktop:
              - 'flutter_client/linux/**'
              - 'flutter_client/windows/**'
              - 'flutter_client/lib/**'
              - 'flutter_client/pubspec.yaml'
              - 'flutter_client/pubspec.lock'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'

  flutter-gates:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_client
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Provide stub Firebase config for CI
        # google-services.json is gitignored (real one only exists on release
        # builds via a repo secret, see release.yml) - the Google Services
        # Gradle plugin still needs *a* validly-shaped file to parse to run
        # native unit tests at all, so use a checked-in dummy here.
        run: cp ci/google-services.stub.json android/app/google-services.json

      - name: Test native Android code
        run: ./android/gradlew -p android :app:testDebugUnitTest

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter client
        run: flutter analyze lib test

      - name: Test Flutter client
        run: flutter test

  build-linux-native:
    name: Build Linux runner (verify only)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_client
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libmpv-dev \
            libsecret-1-dev libjsoncpp-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux app
        run: flutter build linux --release

      - name: Verify Linux runner and runtime files
        run: |
          BUNDLE="build/linux/x64/release/bundle"
          test -x "$BUNDLE/m3u_tv"
          test -s "$BUNDLE/lib/libflutter_linux_gtk.so"
          test -s "$BUNDLE/lib/libmpv.so.2"
          test -s "$BUNDLE/lib/libmedia_kit_video_plugin.so"
          test -s "$BUNDLE/data/icudtl.dat"
          test -d "$BUNDLE/data/flutter_assets"
          if ldd "$BUNDLE/m3u_tv" | tee /tmp/m3u-tv-ldd.txt | grep -q 'not found'; then
            cat /tmp/m3u-tv-ldd.txt
            exit 1
          fi

  build-windows-native:
    name: Build Windows runner (verify only)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: flutter_client
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Verify Windows runner and runtime files
        run: |
          $Bundle = "build\windows\x64\runner\Release"
          $Required = @(
            "m3u_tv.exe",
            "flutter_windows.dll",
            "libmpv-2.dll",
            "data\icudtl.dat",
            "data\flutter_assets\AssetManifest.bin"
          )
          foreach ($RelativePath in $Required) {
            $Path = Join-Path $Bundle $RelativePath
            if (-not (Test-Path $Path -PathType Leaf)) {
              throw "Required Windows bundle file is missing: $Path"
            }
            if ((Get-Item $Path).Length -eq 0) {
              throw "Required Windows bundle file is empty: $Path"
            }
          }

  # ── TEMPORARY: tvOS smoke build ──────────────────────────────────────────
  # Added to validate the issue #186 fix (tvOS releases shipping with no
  # flutter_assets at all, in every release v1.0.0-v1.0.10) against real CI,
  # since ci.yml never exercised tvOS before and release.yml only runs on a
  # version tag. Mirrors the build-tvos job in release.yml minus signing/
  # publishing. Revert this job once a run has confirmed the fix works.
  build-tvos-smoke:
    name: "[TEMP] tvOS smoke build"
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter_client
    steps:
      - uses: actions/checkout@v7

      - name: Install flutter-tvos
        run: |
          git clone --depth 1 --branch v3.44.2-tvos.1.3.1 \
            https://github.com/fluttertv/flutter-tvos.git $HOME/flutter-tvos
          echo "$HOME/flutter-tvos/bin" >> $GITHUB_PATH

      - name: Precache tvOS engine artifacts
        run: flutter-tvos precache

      - name: Get dependencies
        run: flutter-tvos pub get

      - name: Disable code signing in tvOS project
        run: |
          sed -i '' \
            -e 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' \
            -e 's/DEVELOPMENT_TEAM = [^;]*/DEVELOPMENT_TEAM = ""/g' \
            -e 's/"DEVELOPMENT_TEAM\[sdk=appletvos\*\]" = [^;]*/"DEVELOPMENT_TEAM[sdk=appletvos*]" = ""/g' \
            -e 's/PROVISIONING_PROFILE_SPECIFIER = [^;]*/PROVISIONING_PROFILE_SPECIFIER = ""/g' \
            -e 's/"PROVISIONING_PROFILE_SPECIFIER\[sdk=appletvos\*\]" = [^;]*/"PROVISIONING_PROFILE_SPECIFIER[sdk=appletvos*]" = ""/g' \
            -e 's/CODE_SIGN_IDENTITY = "Apple Development"/CODE_SIGN_IDENTITY = ""/g' \
            -e 's/"CODE_SIGN_IDENTITY\[sdk=appletvos\*\]" = [^;]*/"CODE_SIGN_IDENTITY[sdk=appletvos*]" = ""/g' \
            tvos/Runner.xcodeproj/project.pbxproj

      - name: Bundle Flutter assets
        # Works around a flutter-tvos bug - see release.yml's build-tvos job
        # ("Bundle Flutter assets" step) for the full root-cause explanation.
        run: |
          flutter-tvos build bundle --release

      - name: Stage tvOS Flutter artifacts
        # Expected to exit non-zero - see release.yml's build-tvos job for why.
        run: |
          flutter-tvos build tvos --release || \
            echo "flutter-tvos build tvos exited non-zero - expected, see step description. Verifying staged output below."

      - name: Verify staged tvOS Flutter artifacts
        run: |
          set -euo pipefail
          if [ ! -s "tvos/Flutter/flutter_assets/AssetManifest.bin" ]; then
            echo "ERROR: tvos/Flutter/flutter_assets/AssetManifest.bin missing or empty after flutter-tvos build - Flutter asset staging did not complete."
            exit 1
          fi
          if [ ! -d "tvos/Flutter/App.framework" ]; then
            echo "ERROR: tvos/Flutter/App.framework missing after flutter-tvos build - Dart AOT compile did not complete."
            exit 1
          fi

      - name: Archive tvOS (unsigned)
        run: |
          xcodebuild archive \
            -workspace tvos/Runner.xcworkspace -scheme Runner \
            -sdk appletvos -configuration Release \
            -destination 'generic/platform=tvOS' \
            -archivePath build/Runner.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP="build/Runner.xcarchive/Products/Applications/Runner.app"
          if [ ! -d "$APP" ]; then
            echo "ERROR: Runner.app not found at expected xcarchive path - listing build/Runner.xcarchive/:"
            find build/Runner.xcarchive -maxdepth 4 || true
            exit 1
          fi
          mkdir -p build/tvos/Payload
          cp -r "$APP" build/tvos/Payload/Runner.app
          (cd build/tvos && zip -qr "../../m3u-tv-tvos-smoke.ipa" Payload/)

      - name: Verify tvOS IPA contains flutter_assets
        run: |
          set -euo pipefail
          VERIFY_DIR="$RUNNER_TEMP/tvos-ipa-verify"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          unzip -q "m3u-tv-tvos-smoke.ipa" -d "$VERIFY_DIR"
          ASSETS="$VERIFY_DIR/Payload/Runner.app/flutter_assets"
          if [ ! -d "$ASSETS" ]; then
            echo "ERROR: flutter_assets directory missing from packaged IPA at $ASSETS"
            exit 1
          fi
          for f in AssetManifest.bin FontManifest.json; do
            if [ ! -s "$ASSETS/$f" ]; then
              echo "ERROR: required file missing or empty in flutter_assets: $f"
              exit 1
            fi
          done
          if [ -z "$(find "$ASSETS/assets" -type f 2>/dev/null | head -1)" ]; then
            echo "ERROR: flutter_assets/assets contains no files"
            exit 1
          fi
          for f in kernel_blob.bin isolate_snapshot_data vm_snapshot_data; do
            if [ -e "$ASSETS/$f" ]; then
              echo "ERROR: JIT-only debug artifact '$f' found in a release flutter_assets - should have been excluded by the tvOS Copy flutter_assets build phase"
              exit 1
            fi
          done
          echo "tvOS smoke build OK: flutter_assets present, populated, and free of debug JIT artifacts."

      - uses: actions/upload-artifact@v7
        with:
          name: tvos-smoke-ipa
          path: flutter_client/m3u-tv-tvos-smoke.ipa
